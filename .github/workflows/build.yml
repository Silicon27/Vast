name: Test Binary

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  run-vast:
    runs-on: macos-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Run the provided commands
      - name: Export the repo
        run: |
          ls
          cd ..
          ls
          pwd
          export PYTHONPATH=~/Vast:$PYTHONPATH
          cd Vast

      - name: Run Vast
        run: |
          cd cmake-build-debug
          ./Vast ../examples/cvast/test/test.cv -o yes.s
