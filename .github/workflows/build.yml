name: Build main.cpp in cvast

on:
  push:
  pull_request:
    paths:
      - cvast/main.cpp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup C++ environment
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev

      - name: Compile main.cpp
        working-directory: ./cvast
        run: |
          g++ -o main main.cpp \
          -I/opt/homebrew/opt/python@3.13/Frameworks/Python.framework/Versions/3.13/include/python3.13 \
          -L/opt/homebrew/opt/python@3.13/Frameworks/Python.framework/Versions/3.13/lib \
          -lpython3.13

      - name: Run the compiled program (Optional)
        working-directory: ./cvast
        run: ./main
