name: MacOS Workflow

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  run-vast:
    runs-on: macos-latest

    steps:
      # Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Run the provided commands
      - name: Run Vast
        run: |
          cd cmake-build-debug
          ./Vast ../examples/cvast/test/test.cv