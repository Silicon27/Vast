name: Build main.cpp in cvast

on:
  push:
  pull_request:
    paths:
      - cvast/main.cpp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev, python3.13-dev

      - name: Build with CMake
        working-directory: ./cvast
        run: |
          mkdir -p build
          cd build
          cmake ../../.github
          make

      - name: Run the compiled program (Optional)
        working-directory: ./cvast/build
        run: ./Vast
